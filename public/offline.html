<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e6b5b" />
    <title>No internet · Shop Hisab</title>
    <style>
      :root {
        --mist: #f2f4f3;
        --ink: #1e2925;
        --muted: #6a7873;
        --line: #e2e7e5;
        --accent: #2e6b5b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--mist);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px;
        text-align: center;
      }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 6px; }
      p { color: var(--muted); margin: 0 0 4px; line-height: 1.5; }
      button {
        margin-top: 20px;
        width: 100%;
        height: 46px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon-192.png" alt="" />
      <h1>No internet</h1>
      <p>Shop Hisab needs internet to save and show your accounts.</p>
      <p>ইন্টারনেট নেই। সংযোগ ফিরলে আবার চেষ্টা করুন।</p>
      <button onclick="location.reload()">Try again / আবার চেষ্টা</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
